[project]
name = "agent-hub"
version = "0.1.0"
description = "Brainwave AgentHub — Agentic RAG & multi-agent ingestion (Phase 3). Python · LangGraph · reasoning only."
readme = "README.md"
requires-python = ">=3.12"

# Runtime dependencies. Kept deliberately small at M0; the agent/graph stack
# (langgraph, checkpointer, kafka, grpc) is declared now so the image is stable
# across milestones even though M0 only exercises FastAPI + health.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "httpx>=0.27",
    # --- agent stack (wired from M1 onward) ---
    "langgraph>=0.2.50",
    "langgraph-checkpoint-postgres>=2.0",
    "langchain-core>=0.3",
    "langchain-ollama>=0.2",
    "psycopg[binary,pool]>=3.2",
    # --- know-hub gRPC client (ADR-AGT-08) ---
    "grpcio>=1.68",
    "grpcio-tools>=1.68",   # protoc codegen (build/dev step); kept in runtime so
                            #   the dev container can regenerate stubs on start
    "protobuf>=5.28",
    # --- ingestion / events (wired from M6) ---
    "aiokafka>=0.12",
    # --- observability (wired from M4) ---
    "langfuse>=2.53",
]

[project.optional-dependencies]
# Document extraction for the ingestion crew's Extractor (M6). Python's parsing
# stack is the real reason agent-hub can index PDFs/DOCX that the Phase-1
# TypeScript worker SKIPPED (review Issue 3).
extract = [
    "pypdf>=5.1",
    "python-docx>=1.1",
]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
    "grpcio-tools>=1.68",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_hub"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
